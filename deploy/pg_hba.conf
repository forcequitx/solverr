# Who may connect to Postgres, checked top to bottom (mounted by deploy/docker-compose.yml). Postgres is not published; the website
# comes in through PgBouncer. 10.89.0.0/24 (backend) and 10.89.1.0/24 (pooler) are fixed in deploy/docker-compose.yml; keep them in step.
# TYPE   DATABASE   USER       ADDRESS          METHOD

# Inside the container over the Unix socket: the image's own setup, psql maintenance, backup.sh's pg_dump and WAL-G backups.
local    all        all                         trust

# Each network's gateway: traffic from the server itself, or forwarded by Docker's proxy, arrives from it, so it never counts as a container.
host     all        all        10.89.1.1/32     reject
host     all        all        10.89.0.1/32     reject

# PgBouncer, alone on the pooler network, for the website on Vercel: only the solverr_web role (rows only, no schema changes), only its database.
host     solverr    solverr_web 10.89.1.0/24    scram-sha-256

# The containers on the backend network: worker, migrations, db-roles and GlitchTip.
host     all        all        10.89.0.0/24     scram-sha-256

# Everything else, including the superuser from outside this server.
host     all        all        all              reject
