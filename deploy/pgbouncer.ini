# PgBouncer in front of Postgres (mounted by deploy/docker-compose.yml): the website on Vercel logs in here, never to Postgres itself.
# A client costs PgBouncer about 30 KB until it has logged in; only then does it get a Postgres connection, so clients that
# never finish logging in cannot use up Postgres's max_connections.

[databases]
# No user here, so each client logs in to Postgres as itself; pool_size matches solverr_web's CONNECTION LIMIT in deploy/db-roles.sql.
solverr = host=postgres port=5432 dbname=solverr pool_size=150

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
# No Unix socket: the filesystem is read-only, and the admin console stays unreachable (no admin_users).
unix_socket_dir =

# deploy/pgbouncer_hba.conf admits only solverr_web, over TLS, with SCRAM. Its password is in /run/pgbouncer/userlist.txt, written
# at start from deploy/pgbouncer.env, so checking a login never needs Postgres.
auth_type = hba
auth_hba_file = /etc/pgbouncer/pgbouncer_hba.conf
auth_file = /run/pgbouncer/userlist.txt

# Session mode: a client keeps its Postgres connection until it disconnects, as a direct connection would, so LISTEN keeps working.
pool_mode = session
# Clients that have not logged in within 5 s are dropped (the website's own connect timeout is 5 s too). 5000 clients fit the
# container's 512 MB and 8192 open files, so a flood has to reopen about 1000 TLS connections every second to fill them.
max_client_conn = 5000
client_login_timeout = 5
# A logged-in client waits at most 10 s for one of the 150 Postgres connections, then gets an error.
query_wait_timeout = 10
# A Vercel instance can be frozen or removed without closing its socket; TCP keepalive drops such a client in about 90 s,
# instead of the system's 2 hours, so its session stops holding a Postgres connection.
tcp_keepalive = 1
tcp_keepidle = 60
tcp_keepintvl = 10
tcp_keepcnt = 3

# node-postgres sends these in its startup packet (lib/db.ts); PgBouncer refuses startup parameters it does not track.
# The same values are solverr_web's role defaults (deploy/db-roles.sql), which DISCARD ALL restores between clients.
track_extra_parameters = statement_timeout, idle_in_transaction_session_timeout

# TLS files from deploy/postgres-tls.sh: the website checks this server against DATABASE_CA_CERT, and must itself show a certificate
# signed by client-ca.crt (DATABASE_CLIENT_CERT) before its password is checked. Plain connections and ones without it are refused.
client_tls_sslmode = verify-ca
client_tls_ca_file = /etc/pgbouncer/tls/client-ca.crt
client_tls_protocols = secure
client_tls_cert_file = /etc/pgbouncer/tls/server.crt
client_tls_key_file = /etc/pgbouncer/tls/server.key
# Postgres is on the server's own pooler network and has no TLS.
server_tls_sslmode = disable
