name: solverr-dev

services:
  postgres:
    image: postgres:17.11@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
    environment:
      POSTGRES_USER: solverr
      POSTGRES_PASSWORD: solverr
      POSTGRES_DB: solverr
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U solverr -d solverr"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
